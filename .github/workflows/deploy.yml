name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Nuxt
        run: npm run build

      - name: Compress build
        run: |
          tar -czf frontend.tar.gz .output package.json package-lock.json

      - name: Copy archive to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          overwrite: true
          source: "frontend.tar.gz"
          target: "/root/app/frontend"

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          command_timeout: 30m
          script: |
            set -e

            mkdir -p /root/app/frontend
            cd /root/app/frontend

            echo "Cleaning old build..."
            rm -rf .output
            rm -f package.json package-lock.json

            echo "Extracting archive..."
            tar -xzf frontend.tar.gz

            echo "Removing archive..."
            rm -f frontend.tar.gz

            echo "Restarting frontend..."
            cd /root/app
            docker-compose build frontend
            docker-compose up -d frontend