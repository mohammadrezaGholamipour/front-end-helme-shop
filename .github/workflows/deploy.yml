name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Nuxt
        run: npm run build

      - name: Compress build
        run: |
          tar -czf frontend.tar.gz .output package.json package-lock.json
          ls -lh frontend.tar.gz

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa

          chmod 600 ~/.ssh/id_rsa

      - name: Compress build
        run: |
          tar -czf frontend.tar.gz .output package.json package-lock.json
          ls -lh frontend.tar.gz
          sha256sum frontend.tar.gz

      - name: Test SSH
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -p ${{ secrets.PORT }} \
            -i ~/.ssh/id_rsa \
            ${{ secrets.USERNAME }}@${{ secrets.HOST }} \
            "echo SSH_CONNECTION_SUCCESS"

      - name: Copy archive with rsync
        run: |
          rsync -av \
            --partial \
            --append-verify \
            --info=progress2 \
            --timeout=600 \
            -e "ssh \
              -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=10 \
              -o ConnectTimeout=30 \
              -i ~/.ssh/id_rsa \
              -p ${{ secrets.PORT }}" \
            frontend.tar.gz \
            ${{ secrets.USERNAME }}@${{ secrets.HOST }}:/root/app/frontend/frontend.tar.gz

      - name: Deploy on VPS
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -p ${{ secrets.PORT }} \
            -i ~/.ssh/id_rsa \
            ${{ secrets.USERNAME }}@${{ secrets.HOST }} << 'EOF'

          set -e

          cd /root/app/frontend

          echo "Removing old files..."

          rm -rf .output
          rm -f package.json package-lock.json


          echo "Extracting archive..."

          tar -xzf frontend.tar.gz


          echo "Removing archive..."

          rm -f frontend.tar.gz


          echo "Restarting frontend..."

          cd /root/app

          docker-compose build frontend

          docker-compose up -d frontend


          echo "Deployment completed!"

          EOF
